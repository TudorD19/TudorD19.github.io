<marker id="a-bfs" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0.8 L9 5 L0 9.2 z" fill="#a9c1ee"/></marker>
<marker id="a-dij" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0.8 L9 5 L0 9.2 z" fill="#63d2b0"/></marker>
